              - heading "Common questions" [level=2] [ref=f52e792]
            - generic [ref=f52e793]:
              - generic [ref=f52e794]:
                - generic [ref=f52e795] [cursor=pointer]:
                  - generic [ref=f52e796]:
                    - generic [ref=f52e797]: What counts as a "query"?
                    - generic [ref=f52e798]: +
                  - generic: A query is a single prompt sent to an AI engine to measure your brand's visibility. For example, asking ChatGPT "What is the best CRM in Saudi Arabia?" counts as one query. Each query returns a scored response showing whether your brand was mentioned, how prominently, and in what context.
                - generic [ref=f52e799] [cursor=pointer]:
                  - generic [ref=f52e800]:
                    - generic [ref=f52e801]: Which AI engines are supported?
                    - generic [ref=f52e802]: +
                  - generic: We currently support ChatGPT, Gemini, Perplexity, Meta AI, and Microsoft Copilot. Claude and DeepSeek are in active integration. Discovery and Foundation plans start with 2 LLMs; Ecom Powerhouse unlocks 5; Enterprise is custom.
                - generic [ref=f52e803] [cursor=pointer]:
                  - generic [ref=f52e804]:
                    - generic [ref=f52e805]: Can I switch plans at any time?
                    - generic [ref=f52e806]: +
                  - generic: Yes. You can upgrade immediately — your new limits apply right away. Downgrades take effect at the next billing cycle. There are no penalties or long-term commitments on monthly plans.
                - generic [ref=f52e807] [cursor=pointer]:
                  - generic [ref=f52e808]:
                    - generic [ref=f52e809]: Is there a free trial?
                    - generic [ref=f52e810]: +
                  - generic: The Discovery plan at $7.99/month is designed as a low-risk entry point. Foundation starts at $9.99 for the first month, then $19.99/mo after. Reach out to our team if you need a custom evaluation period for Enterprise.
              - generic [ref=f52e811]:
                - generic [ref=f52e812] [cursor=pointer]:
                  - generic [ref=f52e813]:
                    - generic [ref=f52e814]: What languages do you support?
                    - generic [ref=f52e815]: +
                  - generic: Zaher.AI is Arabic-first by design. Our query library, scoring models, and reports are built for Arabic-speaking markets including Saudi Arabia, UAE, Egypt, and the broader MENA region. English is also fully supported on all plans.
                - generic [ref=f52e816] [cursor=pointer]:
                  - generic [ref=f52e817]:
                    - generic [ref=f52e818]: How is billing handled?
                    - generic [ref=f52e819]: +
                  - generic: We accept all major credit cards. Monthly plans are billed on the same day each month. Quarterly plans are billed every 3 months and save you 20%. All transactions are secured via Stripe.
                - generic [ref=f52e820] [cursor=pointer]:
                  - generic [ref=f52e821]:
                    - generic [ref=f52e822]: What's the difference between markets and LLMs?
                    - generic [ref=f52e823]: +
                  - generic: Markets are geographic/linguistic segments (e.g., Saudi Arabia in Arabic, UAE in English). LLMs are the AI engines being queried (ChatGPT, Gemini, etc.). You can track the same brand across different markets and across different AI engines to see how visibility varies.
                - generic [ref=f52e824] [cursor=pointer]:
                  - generic [ref=f52e825]:
                    - generic [ref=f52e826]: Do you offer refunds?
                    - generic [ref=f52e827]: +
                  - generic: Monthly subscribers can cancel anytime. Cancellation takes effect at the end of the current billing period. For billing questions, contact support@zaher.ai or see our Refund Policy.
